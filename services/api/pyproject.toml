[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-slides-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "financial-slides-worker",
  "httpx2>=2.9,<3",
  "jsonschema>=4.23",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2.9,<4",
  "python-dotenv>=1.1,<2",
  "temporalio>=1.18,<2",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
financial-slides-worker = { workspace = true }
