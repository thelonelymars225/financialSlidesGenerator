packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true

overrides:
  browserslist: ">=4.28.7"
  fast-uri: ">=3.1.5"
  nanoid: ">=3.3.18"

# No patched image-size release exists. The renderer never accepts ICNS/JXL/HEIF
# input: the authenticated upload API accepts signature-verified PDFs only.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
