packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true

overrides:
  browserslist: "4.28.8"
  fast-uri: "3.1.6"
  nanoid: "3.3.18"
  postcss: "8.5.23"

# PptxGenJS pins image-size 1.x, but the affected ICNS/JXL/HEIF parsers are
# unreachable: this application accepts PDF source files and approved assets.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
