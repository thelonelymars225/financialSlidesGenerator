name: Security

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  locked-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level high
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv export --all-packages --no-dev --no-emit-workspace --frozen --output-file /tmp/requirements.txt
      - run: uv tool run pip-audit --requirement /tmp/requirements.txt --no-deps --disable-pip
