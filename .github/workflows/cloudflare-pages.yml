name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://financialslidesgenerator-production.up.railway.app
        run: pnpm --filter @financial-slides/web build

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          account_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          project_url="${account_url}/financial-slides-generator"
          status="$(curl --silent --show-error \
            --output /tmp/cloudflare-pages-project.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "${project_url}")"

          if [ "${status}" = "200" ]; then
            exit 0
          fi

          if [ "${status}" != "404" ]; then
            jq -r '.errors[]?.message // "Cloudflare API request failed"' \
              /tmp/cloudflare-pages-project.json >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"name":"financial-slides-generator","production_branch":"dev"}' \
            "${account_url}" >/dev/null

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.118.0"
          workingDirectory: apps/web
          command: pages deploy dist --project-name=financial-slides-generator --branch=dev

      - name: Record deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages deployment: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
