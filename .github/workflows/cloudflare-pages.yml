name: Deploy dev

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  railway:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Railway configuration
        id: railway-config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -n "${RAILWAY_TOKEN}" ] \
            && [ -n "${RAILWAY_PROJECT_ID}" ] \
            && [ -n "${RAILWAY_SERVICE_ID}" ] \
            && [ -n "${RAILWAY_ENVIRONMENT_ID}" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Railway deployment skipped: configure RAILWAY_TOKEN and the Railway repository variables." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install Railway CLI
        if: steps.railway-config.outputs.ready == 'true'
        run: npm install --global @railway/cli

      - name: Deploy API
        if: steps.railway-config.outputs.ready == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: |
          railway up --ci \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT_ID}" \
            --service "${RAILWAY_SERVICE_ID}" \
            --message "dev ${GITHUB_SHA}"

  cloudflare:
    name: Build and deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.deployment-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Cloudflare configuration
        id: cloudflare-config
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          DEV_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] \
            && [ -n "${CLOUDFLARE_API_TOKEN}" ] \
            && [ -n "${CLOUDFLARE_PAGES_PROJECT_NAME}" ] \
            && [ -n "${DEV_API_BASE_URL}" ]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare deployment skipped: configure Cloudflare credentials and repository variables." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install pnpm
        if: steps.cloudflare-config.outputs.ready == 'true'
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        if: steps.cloudflare-config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.cloudflare-config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.cloudflare-config.outputs.ready == 'true'
        env:
          VITE_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
        run: pnpm --filter @financial-slides/web build

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare-config.outputs.ready == 'true'
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=dev
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment URL
        if: steps.cloudflare-config.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: echo "Cloudflare Pages deployment: ${DEPLOYMENT_URL}" >> "${GITHUB_STEP_SUMMARY}"
