name: Continuous Improvement

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install integration-test browser
        run: pnpm --filter @financial-slides/presentation-harness exec playwright install --with-deps chromium

      - name: Install Python dependencies
        run: uv sync --all-packages --all-extras --frozen

      - name: Check source
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build API container
        run: docker build --file Dockerfile.api --tag financial-slides-api:test .

      - name: Build worker container
        run: docker build --file Dockerfile.worker --tag financial-slides-worker:test .
