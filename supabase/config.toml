project_id = "financial-slides-generator"

[api]
enabled = true
schemas = ["public", "graphql_public"]

[db]
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
